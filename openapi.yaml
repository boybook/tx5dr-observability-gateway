openapi: 3.1.0
info:
  title: TX-5DR Observability Gateway
  version: 1.0.0
servers:
  - url: https://replace-with-fc-trigger-url
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Gateway is ready
  /v1/installations/register:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Installation registered and token issued
        '400':
          description: Invalid request
        '503':
          description: SLS unavailable
  /v1/telemetry/events:
    post:
      security:
        - installationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '202':
          description: Events accepted
        '400':
          description: Invalid request
        '401':
          description: Invalid installation token
        '429':
          description: Rate limited
        '503':
          description: SLS unavailable
  /v1/diagnostics/authorize:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticAuthorization'
      responses:
        '201':
          description: Short-lived diagnostic token issued without recording an installation
        '400':
          description: Invalid request
        '429':
          description: Rate limited
  /v1/diagnostics/uploads:
    post:
      security:
        - diagnosticToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticUpload'
      responses:
        '201':
          description: Bounded OSS upload form and signed completion receipt
        '400':
          description: Invalid request
        '401':
          description: Invalid diagnostic token
        '429':
          description: Rate limited
  /v1/diagnostics/uploads/{uploadId}/complete:
    post:
      security:
        - diagnosticToken: []
      parameters:
        - in: path
          name: uploadId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, upload_receipt]
              properties:
                schema_version: { const: 1 }
                upload_receipt: { type: string, maxLength: 16384 }
                feedback: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Object verified and metadata accepted
        '400':
          description: Invalid or expired upload receipt
        '401':
          description: Invalid diagnostic token
        '409':
          description: Uploaded object does not match the signed declaration
components:
  securitySchemes:
    installationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    diagnosticToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AppMetadata:
      type: object
      additionalProperties: false
      required: [version, build_channel, build_commit, distribution, os_family, arch]
      properties:
        version: { type: string, maxLength: 64 }
        build_channel: { enum: [release, nightly] }
        build_commit: { type: string, maxLength: 64 }
        distribution: { enum: [electron, docker, android-bridge, linux-service, generic-server, web-dev] }
        os_family: { enum: [win32, darwin, linux, android, other] }
        arch: { enum: [x64, arm64, arm, other] }
    Registration:
      type: object
      additionalProperties: false
      required: [schema_version, registration_event_id, installation_id, app]
      properties:
        schema_version: { const: 1 }
        registration_event_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        app: { $ref: '#/components/schemas/AppMetadata' }
    DiagnosticAuthorization:
      type: object
      additionalProperties: false
      required: [schema_version, authorization_event_id, installation_id, app]
      properties:
        schema_version: { const: 1 }
        authorization_event_id: { type: string, format: uuid }
        installation_id: { type: string, format: uuid }
        app: { $ref: '#/components/schemas/AppMetadata' }
    DiagnosticUpload:
      type: object
      additionalProperties: false
      required: [schema_version, upload_id, app, source_id, requested_from_ms, requested_to_ms, included_from_ms, included_to_ms, line_count, uncompressed_bytes, compressed_bytes, sha256]
      properties:
        schema_version: { const: 1 }
        upload_id: { type: string, format: uuid }
        app: { $ref: '#/components/schemas/AppMetadata' }
        source_id: { enum: [server, electron-main, client-tools] }
        requested_from_ms: { type: integer }
        requested_to_ms: { type: integer }
        included_from_ms: { type: integer }
        included_to_ms: { type: integer }
        line_count: { type: integer, minimum: 1 }
        uncompressed_bytes: { type: integer, minimum: 1, maximum: 52428800 }
        compressed_bytes: { type: integer, minimum: 1, maximum: 20971520 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        is_test: { type: boolean, default: false }
    EventBatch:
      type: object
      additionalProperties: false
      required: [schema_version, app, events]
      properties:
        schema_version: { const: 1 }
        app: { $ref: '#/components/schemas/AppMetadata' }
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [event_id, event_name, occurred_at_ms, session_id, runtime_state, active_connections, uptime_seconds, reason]
            properties:
              event_id: { type: string, format: uuid }
              event_name: { enum: [session_started, presence_snapshot, session_ended] }
              occurred_at_ms: { type: integer }
              session_id: { type: string, format: uuid }
              runtime_state: { enum: [online, offline] }
              active_connections: { type: integer, minimum: 0 }
              uptime_seconds: { type: integer, minimum: 0 }
              reason: { enum: [startup, heartbeat, connection_change, shutdown] }
