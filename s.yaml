edition: 3.0.0
name: tx5dr-observability-gateway
access: default

vars:
  region: ${env('ALIYUN_REGION')}
  project: ${env('SLS_PROJECT')}

resources:
  gateway:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ${env('FC_FUNCTION_NAME')}
      description: Privacy-preserving telemetry and diagnostics ingress for TX-5DR
      runtime: nodejs20
      handler: index.handler
      code: ./dist
      role: ${env('FC_RUNTIME_ROLE_ARN')}
      cpu: 0.25
      memorySize: 256
      diskSize: 512
      timeout: 10
      instanceConcurrency: 20
      internetAccess: false
      environmentVariables:
        SLS_ENDPOINT: ${env('SLS_ENDPOINT')}
        SLS_PROJECT: ${vars.project}
        SLS_INSTALLATIONS_LOGSTORE: ${env('SLS_INSTALLATIONS_LOGSTORE')}
        SLS_EVENTS_LOGSTORE: ${env('SLS_EVENTS_LOGSTORE')}
        TOKEN_SIGNING_KEY_CURRENT: ${env('TOKEN_SIGNING_KEY_CURRENT')}
        TOKEN_SIGNING_KEY_PREVIOUS: ${env('TOKEN_SIGNING_KEY_PREVIOUS', '')}
        TOKEN_SIGNING_KEY_ID: ${env('TOKEN_SIGNING_KEY_ID', 'v1')}
        INSTALLATION_HMAC_KEY: ${env('INSTALLATION_HMAC_KEY')}
      logConfig:
        enableInstanceMetrics: true
        enableRequestMetrics: true
        logBeginRule: DefaultRegex
        project: ${vars.project}
        logstore: ${env('FC_RUNTIME_LOGSTORE')}
      triggers:
        - triggerName: publicHttp
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
